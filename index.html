<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ドメインチェック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="form">
      <label for="domain">ドメインを入力</label>
      <div class="input">
        <input id="domain" type="text" placeholder="example.co.jp" required autocomplete="off" spellcheck="false" autofocus>
        <button id="start" type="submit" aria-label="チェック">→</button>
      </div>
    </form>
    <section aria-labelledby="result-label">
      <h2 id="result-label">結果</h2>
      <p id="result" role="status" aria-live="polite">—</p>
    </section>
  </main>
  <script src="core.js"></script>
  <script src="ui.js"></script>
</body>
</html>
